name: CI

# SELF-HOSTED gate (runner `kimcad-windows` on the target 780M/32GB Windows box). This runs the
# SAME authoritative gate as the local pre-push hook — `scripts/ci.sh` = ruff + geometry-backend
# probe + the FULL pytest suite INCLUDING the live OpenSCAD/OrcaSlicer/CadQuery tests + frontend
# vitest + byte-exact SPA build reproducibility — plus a pip-audit dependency CVE scan on the
# committed lockfile. Hosted runners are not used (private repo, metered minutes; and a hosted
# Linux runner could never run the live Windows tool contract anyway).
#
# The workspace self-provisions on first run (venv from requirements.lock, tools/ via
# fetch_tools.py, the .venv-cq313 CadQuery worker venv, frontend node_modules) and reuses those
# caches afterwards — self-hosted _work persists between runs.
#
# Trigger policy (ENG-005, stage-A gate): push + manual only — NO pull_request. A self-hosted
# runner on the dev box must never execute fork-PR code; this line is the guard that keeps the
# repo safe the day it goes public. Do not add pull_request back without moving PR builds to an
# isolated runner.
#
# Caveat (accepted): the runner lives in the developer's logon session on the dev box, so CI runs
# only while that box is up and logged in. For a one-developer project whose dev machine IS the
# deployment target, that is the honest trust boundary, not a shortcut.

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KIMCAD_CI_NODE: C:\kimcad-ci-tools\node22
  # The py launcher is a per-user install on this box (not on the service PATH).
  KIMCAD_PY_LAUNCHER: C:\Users\scott\AppData\Local\Programs\Python\Launcher\py.exe
  # TEST-001 (stage-BCD gate): on the provisioned runner every test must EXECUTE — any
  # skip (binary-gated, profile-gated, interpreter-gated) fails the gate in ci.sh.
  KIMCAD_CI_STRICT: "1"

jobs:
  gate:
    runs-on: [self-hosted, kimcad-windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ENG-004 (stage-A gate): every powershell step runs strict — terminating cmdlet errors
      # AND native-command failures both fail the step, not just the last command's exit code.
      - name: Provision Python venv (cached across runs; pinned by requirements.lock)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path ".venv\Scripts\python.exe")) {
            & $env:KIMCAD_PY_LAUNCHER -3.13 -m venv .venv
            if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          }
          .\.venv\Scripts\python.exe -m pip install --quiet --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          .\.venv\Scripts\python.exe -m pip install --quiet -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "lockfile install failed" }
          .\.venv\Scripts\python.exe -m pip install --quiet --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw "editable install failed" }

      - name: Provision Playwright + Chromium (KC-20 #25; e2e suite — NOT in requirements.lock)
        # Browser test tooling is deliberately out of the lock (it must never enter the user-facing
        # installer's dependency set), so the gate installs it here, pinned, plus the Chromium
        # binary a pip lock can't express. With Chromium present the e2e tests RUN under STRICT
        # (no green-by-skip); without it they'd skip via the needs_browser marker.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -c requirements.lock: install playwright + its transitives WITHOUT moving any
          # lock-pinned version, so the post-lock install can't perturb the audited tree (ENG-4).
          .\.venv\Scripts\python.exe -m pip install --quiet -c requirements.lock "playwright==1.60.0" "pytest-playwright==0.8.0"
          if ($LASTEXITCODE -ne 0) { throw "playwright install failed" }
          .\.venv\Scripts\python.exe -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "chromium download failed" }

      - name: Provision CAD/slicer tools (cached; checksum-pinned fetch)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "tools\openscad\openscad.exe") -or -not (Test-Path "tools\orcaslicer\orca-slicer.exe")) {
            .\.venv\Scripts\python.exe scripts\fetch_tools.py
            if ($LASTEXITCODE -ne 0) { throw "tool fetch failed" }
          } else { "tools cached" }

      # TEST-102: the real-LLM live tests (test_landing_examples + the TEST-101 pipeline test) plan
      # with the configured default chat model via Ollama. Like the OrcaSlicer/CadQuery presence
      # checks above, probe it BEFORE the gate so its ABSENCE fails the build LOUDLY here rather than
      # turning the real-model contract into a silent green-by-skip. The model name is read from the
      # shipped config so this can't drift from the product's actual default (qwen2.5:7b today).
      - name: Probe Ollama + the default chat model (real-LLM contract must not skip)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $model = .\.venv\Scripts\python.exe -c "from kimcad.config import Config; print(Config.load().llm_backend(None).model_name)"
          if ($LASTEXITCODE -ne 0) { throw "could not read the default chat model from config" }
          $model = $model.Trim()
          "default chat model: $model"
          # `ollama list` must succeed (the daemon is up) AND list the configured model — otherwise
          # the live real-LLM tests would pytest.skip and STRICT's skip-grep would be their only net.
          $list = & ollama list
          if ($LASTEXITCODE -ne 0) { throw "ollama not reachable (daemon down?) - real-LLM live tests would skip" }
          $base = ($model -split ':')[0]
          if (-not ($list | Select-String -SimpleMatch $base)) {
            throw "default chat model '$model' not pulled (run: ollama pull $model) - real-LLM live tests would skip"
          }
          "ollama + '$model' present: real-LLM live contract will RUN"

      - name: Provision CadQuery worker venv (cached; proves the sandbox second layer)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path ".venv-cq313\Scripts\python.exe")) {
            & $env:KIMCAD_PY_LAUNCHER -3.13 -m venv .venv-cq313
            if ($LASTEXITCODE -ne 0) { throw "cq venv creation failed" }
            .\.venv-cq313\Scripts\python.exe -m pip install --quiet cadquery
            if ($LASTEXITCODE -ne 0) { throw "cadquery install failed" }
          } else { "cq venv cached" }
          # Warm the import BEFORE the gate probes it: a cold first `import cadquery` (fresh
          # install + Defender scanning the OCP binaries) measured 41s on this runner — the
          # discovery probe must never pay that cost mid-gate (2026-06-10 strict-gate failure).
          $sw = [Diagnostics.Stopwatch]::StartNew()
          .\.venv-cq313\Scripts\python.exe -c "import cadquery" 
          if ($LASTEXITCODE -ne 0) { throw "cadquery import failed - the worker venv is broken" }
          "cq import warm-up: $([math]::Round($sw.Elapsed.TotalSeconds,1))s"

      - name: Provision frontend deps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:KIMCAD_CI_NODE;$env:Path"
          npm --prefix frontend ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }

      - name: Run the authoritative gate (scripts/ci.sh — full suite incl. live + SPA repro)
        # Git Bash by explicit path: `shell: bash` resolves to the WSL launcher
        # (C:\Windows\system32\bash.exe) on this box, and WSL is broken at the OS level here.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "C:\Program Files\Git\bin\bash.exe" --noprofile --norc -e -o pipefail ./scripts/ci.sh
          if ($LASTEXITCODE -ne 0) { throw "gate failed (exit $LASTEXITCODE)" }

      # TEST-002 (stage-A gate): assert EXECUTION, not collection — run the live marker subset
      # itself and require every selected test to PASS with zero skips. A missing binary,
      # missing profiles, or a local.yaml redirect all surface as skips → this step goes red.
      - name: Assert the live tool contracts actually ran (no green-by-skip)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = .\.venv\Scripts\python.exe -m pytest -m live -q -ra 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 0) { throw "live subset failed (exit $LASTEXITCODE)" }
          if ($out -notmatch '(\d+) passed') { throw "could not read live pass count" }
          $passed = [int]$Matches[1]
          if ($passed -lt 1) { throw "zero live tests executed - contracts unproven" }
          if ($out -match '(\d+) skipped') { throw "$($Matches[1]) live test(s) SKIPPED - contracts unproven (missing binary/profiles/interpreter?)" }
          "live contracts proven: $passed executed, 0 skipped"

      - name: Installer staging smoke (BG-E001 - the proof chain runs on every push)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Stage the EXACT install tree (embeddable python cached under dist/cache) and
          # run the full verify contract against it - no Inno needed. Catches lock-vs-
          # pyproject drift, strip over/under-reach, launcher contract breaks, pin rot.
          .\.venv\Scripts\python.exe scripts\build_installer.py --stage-only
          if ($LASTEXITCODE -ne 0) { throw "installer staging failed" }
          .\.venv\Scripts\python.exe scripts\verify_install.py dist\staging --port 8748
          if ($LASTEXITCODE -ne 0) { throw "verify_install failed on the staged tree" }

      - name: pip-audit (dependency CVE scan on the pinned lockfile)

        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\.venv\Scripts\python.exe -m pip install --quiet pip-audit
          if ($LASTEXITCODE -ne 0) { throw "pip-audit install failed" }
          .\.venv\Scripts\python.exe -m pip_audit -r requirements.lock --strict
          if ($LASTEXITCODE -ne 0) { throw "pip-audit found vulnerabilities or failed" }
          # KC-20 (#25 / ENG-3): the lock audit above doesn't see the e2e browser tooling
          # (playwright/pytest-playwright + transitives), which is installed out-of-lock and runs a
          # real browser on this box. Audit it explicitly. (A full-env `pip-audit` chokes on the
          # editable kimcad install, so derive the pin list from what's actually installed — it
          # can't drift from the gate's pinned tooling.)
          .\.venv\Scripts\python.exe -m pip freeze |
            Select-String -Pattern '^(playwright|pytest-playwright|pyee|greenlet|pytest-base-url|python-slugify|text-unidecode)==' |
            ForEach-Object { $_.Line } | Out-File -Encoding ascii pw-tools.txt
          .\.venv\Scripts\python.exe -m pip_audit -r pw-tools.txt --strict
          if ($LASTEXITCODE -ne 0) { throw "pip-audit (e2e browser tooling) found vulnerabilities or failed" }
