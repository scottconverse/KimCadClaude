name: PR smoke (hosted)

# KC-12 (#16). HOSTED lint + unit smoke for pull requests — including FORK PRs, which the
# self-hosted gate (ci.yml) deliberately never runs (a self-hosted runner must never execute
# untrusted fork code; ci.yml is push + workflow_dispatch only). This gives an outside
# contributor a fast green/red signal on a throwaway GitHub-hosted Ubuntu runner WITHOUT
# exposing the self-hosted box.
#
# What it proves: ruff lint, the hermetic Python unit subset (the live OpenSCAD/OrcaSlicer
# tests are deselected with `-m "not live"`, and the binary/interpreter-gated tests auto-SKIP
# on a runner without them — see conftest.pytest_runtest_setup), and the frontend vitest suite.
# What it does NOT prove (stays self-hosted, run by a maintainer after review): the live Windows
# tool contract (real OpenSCAD/OrcaSlicer/CadQuery) and byte-exact SPA build reproducibility.
# Merging still requires the self-hosted gate to be green on the branch.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # KC-22 (#27): full history so diff-cover can diff the PR's changed lines vs the base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps (runtime + lint/test/coverage tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pytest pytest-cov diff-cover

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Pytest (hermetic unit subset, with coverage)
        # `not live` drops the real-OrcaSlicer tests; the real_tool / needs_cadquery tests
        # auto-skip on a runner without the binaries/interpreter. -ra surfaces those skips so a
        # green run here is never mistaken for the full self-hosted live-tool gate. --cov=kimcad
        # produces coverage.xml for the diff-coverage gate below (scoped to shipped library code).
        run: pytest -q -m "not live" -ra --cov=kimcad --cov-report=xml

      - name: Diff-coverage gate (KC-22 / #27)
        # Changed kimcad lines in this PR must be >= 80% covered overall, and >= 70% for any module
        # with >= 20 changed lines. Note coverage here is the HERMETIC subset (the live-tool tests
        # are skipped), so a line only exercised by a live test counts as uncovered — keep
        # diff-coverable logic unit-testable. The full live gate stays self-hosted.
        run: python scripts/check_diff_coverage.py coverage.xml --compare-branch "origin/${{ github.base_ref }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend unit tests (vitest)
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run test
